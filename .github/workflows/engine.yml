# 새 엔진 — 빌드 + 법칙 시험 + 규칙 시험 (docs/ENGINE.md §7 · §8)
#   빨강이면 엔진 버그다. 시험을 끄지 않는다.
name: engine

on:
  push:
    paths-ignore: ['**.md', 'docs/**', '**.jpg', '**.png', '**.wav', '**.ogg']
  workflow_dispatch:

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 빌드
        run: dotnet build engine/Lab -c Release -o build/lab --nologo -v q
      - name: 법칙 시험
        run: dotnet build/lab/Lab.dll --law
      - name: 규칙 시험 (4갈래 함께 — 묶음 시간표 tools/rule-times.txt)
        run: tools/rules.sh build/lab/Lab.dll 4
      - name: 시간 예산 (새터호 40명 한 틱 4ms · 엔진마다 몫 — 넘으면 빨강)
        run: dotnet build/lab/Lab.dll --budget
      - name: 성능
        run: dotnet build/lab/Lab.dll --bench || true
      # 새 엔진 판 (game/ — 처음 화면에서 고른다 · 장면 scenes/NewEngine.tscn): 게임을 빌드하고, Godot을 받아 새 엔진 판을 화면 없이 10초 띄운다 — 장면이 뜨고 세계가 돌고 그림이 오는지
      # 앞 단계(시간 예산 등)가 빨강이어도 게임 빌드 · 띄워 보기는 돈다 — 화면 쪽 고침을 CI가 늘 확인한다 (시험을 끄는 것이 아니다)
      - name: 게임 빌드 (기존 판 + 새 엔진 판)
        if: always()
        run: dotnet build game/ShipSim.csproj --nologo -v q
      - id: godot
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.7.2-mono-linux
      - name: Godot 받기
        if: always() && steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o g.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          unzip -q g.zip && rm g.zip
      - name: 새 엔진 판 띄워 보기 (화면 없이 10초)
        if: always()
        run: |
          G=~/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64
          timeout 300 $G --headless --path game --import > /dev/null 2>&1 || true
          timeout 120 $G --headless --path game -- --new --ship=Didim --seed=18 --for=10 2>&1 | tee godot.log | grep -E "화면|ERROR|Exception" || true
          grep -qE "화면 [0-9]+초 · 그림 [1-9][0-9]*장" godot.log
