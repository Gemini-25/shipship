<!doctype html><meta charset=utf8><style>
@font-face{font-family:Pretendard;font-weight:700;src:url(Pretendard-Bold.otf)}
@font-face{font-family:Pretendard;font-weight:500;src:url(Pretendard-Medium.otf)}
body{margin:0;background:#0d1018;font-family:Pretendard,sans-serif;color:#e9eef6}
#sheet{width:2000px;padding:28px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;gap:26px 24px}
h1{grid-column:1/3;margin:0;font-size:30px;font-weight:700}
h1 span{font-size:18px;font-weight:500;color:#9aa7bd;margin-left:14px}
figure{margin:0}
img{width:100%;display:block;border-radius:10px;border:1px solid #273042}
figcaption{margin-top:10px;font-size:20px;font-weight:700}
figcaption small{display:block;font-size:15.5px;font-weight:500;color:#a9b5c9;margin-top:4px;line-height:1.45}
.single{width:1920px}
</style>
<div id=sheet>
<h1>그래픽 시안 — 디딤호 가운데 구역 <span>같은 배 도면 · 같은 사람 자리 · 화풍만 다르게</span></h1>
<figure><img src="now.png" style="image-rendering:pixelated"><figcaption>지금<small>도트 그림 · 칸마다 같은 밝기 · 타일 줄이 다 보인다</small></figcaption></figure>
<figure><img src="s1.jpg"><figcaption>시안 1 — 지금 도트 + 그래픽 카드 조명<small>그림은 그대로 두고 방마다 등 빛 · 벽 곁 그늘 · 빛 번짐만 얹는다. 가장 빨리 되지만 도트의 거친 맛은 남는다</small></figcaption></figure>
<figure><img src="s2.jpg"><figcaption>시안 2 — 매끈한 평면<small>도트를 버리고 선과 면으로. 가는 벽 · 비스듬한 벽도 매끈하게 · 방 이름표 · 사람 이름표. 가장 읽기 쉽고 어느 확대에서도 또렷하다</small></figcaption></figure>
<figure><img src="s3.jpg"><figcaption>시안 3 — 매끈한 반입체<small>시안 2에 높이를 준다 (벽 · 가구가 서 있고 사람은 선 모습). 지금의 비스듬한 위 시점을 지킨다. 손이 가장 많이 간다</small></figcaption></figure>
</div>
<img id=a1 class=single src="s1.jpg"><img id=a2 class=single src="s2.jpg"><img id=a3 class=single src="s3.jpg">
